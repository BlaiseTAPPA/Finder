<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Offline – Tankstellen-Finder</title>
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <style>
      /* Self-contained: shown by the service worker when there is no network and no cached page. */
      :root {
        --ink: #1a1a1c;
        --muted: #6e6e73;
        --parchment: #f4f4f4;
        --primary: #0068cc;
        --on-dark: #ffffff;
        --font-sans: "SF Pro Text", "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-display: "SF Pro Display", system-ui, -apple-system, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #ffffff;
        color: var(--ink);
        font-family: var(--font-sans);
        letter-spacing: -0.374px;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }
      header {
        background: var(--ink);
        padding-top: env(safe-area-inset-top);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 72rem;
        height: 56px;
        margin: 0 auto;
        padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
        color: var(--on-dark);
        font-size: 0.875rem;
        font-weight: 500;
      }
      main {
        display: flex;
        min-height: calc(100vh - 56px);
        min-height: calc(100dvh - 56px - env(safe-area-inset-top));
        align-items: center;
        justify-content: center;
        padding: 40px max(16px, env(safe-area-inset-right))
          calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      .card {
        width: 100%;
        max-width: 28rem;
        text-align: center;
      }
      .tile {
        display: inline-flex;
        width: 72px;
        height: 72px;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: var(--parchment);
      }
      h1 {
        margin: 24px 0 0;
        font-family: var(--font-display);
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      p {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.47;
      }
      button {
        display: inline-flex;
        min-height: 44px;
        margin-top: 28px;
        padding: 0 22px;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 9999px;
        background: var(--primary);
        color: var(--on-dark);
        font: inherit;
        font-size: 1rem;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" x2="15" y1="22" y2="22" />
          <line x1="4" x2="14" y1="9" y2="9" />
          <path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18" />
          <path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5" />
        </svg>
        <span>Tankstellen-Finder</span>
      </div>
    </header>
    <main>
      <div class="card">
        <span class="tile" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0068cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h.01" />
            <path d="M8.5 16.429a5 5 0 0 1 7 0" />
            <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
            <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
            <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
            <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
            <path d="m2 2 20 20" />
          </svg>
        </span>
        <h1>Keine Verbindung</h1>
        <p>
          Live-Spritpreise brauchen eine Internetverbindung. Prüfe dein Netz und versuche es
          erneut.
        </p>
        <button type="button" onclick="location.reload()">Erneut versuchen</button>
      </div>
    </main>
    <script>
      // Reload automatically as soon as the connection comes back.
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
